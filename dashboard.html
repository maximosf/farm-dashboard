<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #05050f;
  --surface: #0a0a1a;
  --surface2: #0f0f22;
  --border: #1c1c35;
  --border2: #252545;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --accent3: #c084fc;
  --blue: #3b82f6;
  --green: #10b981;
  --red: #ef4444;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background glow */
body::before {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(124,58,237,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,5,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
}

.logo-icon {
  width: 30px;
  height: 30px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 0 20px rgba(124,58,237,0.4);
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hstat {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 14px;
}

.hstat-val {
  font-size: 18px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hstat-label {
  font-size: 10px;
  color: var(--text3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.divider { width: 1px; height: 30px; background: var(--border); margin: 0 4px; }

.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 0 20px rgba(124,58,237,0.3);
  transition: opacity 0.2s;
}

.btn:hover { opacity: 0.85; }

.timer-text { font-size: 11px; color: var(--text3); }

/* MAIN */
main {
  padding: 24px 28px;
  max-width: 1500px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

/* PHONE CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  transition: border-color 0.3s, transform 0.2s;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover { transform: translateY(-2px); border-color: var(--border2); }
.card:hover::before { opacity: 1; }
.card.running { border-color: rgba(59,130,246,0.3); }
.card.running::before { opacity: 1; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent); }
.card.error { border-color: rgba(239,68,68,0.3); }

/* Card header */
.card-head {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%);
}

.phone-label {
  display: flex;
  align-items: center;
  gap: 12px;
}

.phone-num {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(168,85,247,0.1));
  border: 1px solid rgba(124,58,237,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: var(--accent3);
}

.phone-meta { line-height: 1; }
.phone-title { font-size: 14px; font-weight: 700; color: var(--text); }
.phone-ip { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: monospace; }

.pill {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.pill-running { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
.pill-idle { background: rgba(71,85,105,0.15); color: var(--text3); border: 1px solid var(--border); }
.pill-error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

.dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

/* Card body */
.card-body { padding: 16px 18px; }

.prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.prog-label { font-size: 11px; color: var(--text3); font-weight: 500; }
.prog-val { font-size: 11px; color: var(--accent3); font-weight: 700; }

.prog-bar {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  box-shadow: 0 0 8px rgba(124,58,237,0.5);
}

.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.stat-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}

.stat-box:hover { border-color: var(--border2); }

.stat-val {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}

.stat-lbl {
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 4px;
  font-weight: 500;
}

.vid-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  margin-bottom: 14px;
}

.vid-icon { font-size: 10px; }
.vid-name { font-size: 10px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }

/* Accounts */
.accs-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.accs-title { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.accs-count { font-size: 10px; color: var(--accent3); font-weight: 700; }

.accs-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 170px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.acc-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--bg);
  transition: border-color 0.2s;
}

.acc-row:hover { border-color: var(--border); }
.acc-row.active {
  border-color: rgba(124,58,237,0.4);
  background: rgba(124,58,237,0.07);
}

.acc-name { font-size: 11px; color: var(--text2); font-weight: 500; }
.acc-row.active .acc-name { color: var(--accent3); font-weight: 600; }
.acc-followers { font-size: 11px; font-weight: 700; color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    Farm Dashboard
  </div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-val" id="h-accounts">137</div>
      <div class="hstat-label">Accounts</div>
    </div>
    <div class="divider"></div>
    <div class="hstat">
      <div class="hstat-val" id="h-reels">—</div>
      <div class="hstat-label">Reels Today</div>
    </div>
    <div class="divider"></div>
    <div class="hstat">
      <div class="hstat-val" id="h-active">—</div>
      <div class="hstat-label">Active Phones</div>
    </div>
    <div class="divider"></div>
    <span class="timer-text" id="timer">30s</span>
    <button class="btn" onclick="load()">↻ Refresh</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
const PHONES = {
  1:{ip:'192.168.1.9',accounts:10},
  2:{ip:'192.168.1.12',accounts:30},
  3:{ip:'192.168.1.14',accounts:20},
  4:{ip:'192.168.1.10',accounts:20},
  5:{ip:'192.168.1.11',accounts:19},
  6:{ip:'192.168.1.15',accounts:20},
  7:{ip:'192.168.1.13',accounts:18}
};

function fmt(n){if(!n||n==='?')return'—';n=parseInt(n);if(n>=1000)return(n/1000).toFixed(1)+'K';return n;}

async function load(){
  let totalReels=0,active=0;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(const[num,cfg]of Object.entries(PHONES)){
    let s=null;
    try{const r=await fetch('/status/'+num,{signal:AbortSignal.timeout(3000)});s=await r.json();}catch(e){}
    const running=s?.status==='running';
    const error=s?.status==='error';
    if(running)active++;
    if(s)totalReels+=s.reels_posted||0;
    const pct=s?Math.min(100,Math.round((s.container/s.total_containers)*100)):0;
    const accounts=s?.accounts||{};
    const card=document.createElement('div');
    card.className='card'+(running?' running':error?' error':'');
    const accRows=Array.from({length:cfg.accounts},(_,i)=>{
      const acc=accounts[i+1]||{};
      const isActive=s?.current_container===i+1;
      return`<div class="acc-row${isActive?' active':''}"><span class="acc-name">Account ${i+1}</span><span class="acc-followers">${acc.followers?fmt(acc.followers):'—'}</span></div>`;
    }).join('');
    card.innerHTML=`
      <div class="card-head">
        <div class="phone-label">
          <div class="phone-num">${num}</div>
          <div class="phone-meta">
            <div class="phone-title">Phone ${num}</div>
            <div class="phone-ip">${cfg.ip}</div>
          </div>
        </div>
        <div class="pill ${running?'pill-running':error?'pill-error':'pill-idle'}">
          ${running?'<span class="dot"></span>':''}${running?'Running':error?'Error':'Idle'}
        </div>
      </div>
      <div class="card-body">
        <div class="prog-row">
          <span class="prog-label">Container ${s?s.container:0} / ${s?s.total_containers:cfg.accounts}</span>
          <span class="prog-val">${pct}%</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="stats-row">
          <div class="stat-box"><div class="stat-val">${cfg.accounts}</div><div class="stat-lbl">Accounts</div></div>
          <div class="stat-box"><div class="stat-val">${s?.reels_posted??'—'}</div><div class="stat-lbl">Reels</div></div>
          <div class="stat-box"><div class="stat-val">${s?.reels_verified??'—'}</div><div class="stat-lbl">Verified</div></div>
        </div>
        ${s?.current_video?`<div class="vid-row"><span class="vid-icon">▶</span><span class="vid-name">${s.current_video}</span></div>`:''}
        <div class="accs-head">
          <span class="accs-title">Accounts</span>
          <span class="accs-count">${cfg.accounts} total</span>
        </div>
        <div class="accs-list">${accRows}</div>
      </div>`;
    grid.appendChild(card);
  }
  document.getElementById('h-reels').textContent=totalReels||'—';
  document.getElementById('h-active').textContent=active||'—';
  startTimer();
}

let t;
function startTimer(){
  clearInterval(t);let s=30;
  document.getElementById('timer').textContent=s+'s';
  t=setInterval(()=>{s--;document.getElementById('timer').textContent=s+'s';if(s<=0){clearInterval(t);load();}},1000);
}
load();
</script>
</body>
</html>
